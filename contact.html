<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- リセットCSS -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

    <!-- オリジナルCSS -->
    <link rel="stylesheet" href="./css/style.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section class="contact-top">
            <h2><span>お問</span>い合わせ</h2>
            <p>商品に関するご質問や、取材・お取引のご相談など、お気軽にお問い合わせください。
                内容を確認のうえ、担当より折り返しご連絡いたします。</p>
        </section>
        <section class="contact-main">
            <div class="contact-info">
                <h3>連絡先</h3>
                <table class="table">
                    <tr>
                        <td>
                            <p>社名</p>
                        </td>
                        <td>【会社名】</td>
                    </tr>
                    <tr>
                        <td>
                            <p>電話</p>
                        </td>
                        <td>【電話番号】</td>
                    </tr>
                    <tr>
                        <td>
                            <p>メール</p>
                        </td>
                        <td>【メールアドレス】</td>
                    </tr>
                    <tr>
                        <td>
                            <p>受付時間</p>
                        </td>
                        <td>【受付時間】</td>
                    </tr>
                </table>
            </div>
            <div class="contact-form">
                <h2>フォームでのお問い合わせ</h2>
                    <div class="form">
                    <form action="送信先のURL" method="post">
                      <div class="form-group">  
                        <label for="name">お名前</label>
                        <input id="name" type="text" name="name" placeholder="紬　花子" required>
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input id="email" type="email" name="email" placeholder="email@co.jp" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-type">お問い合わせ種別</label>
                            <select id="contact-type" name="contact-type" required>
                                <option value="" disabled selected>選択してください</option>
                                <option value="商品について">商品に関するご質問</option>
                                <option value="商品について">取材のご依頼</option>
                                <option value="商品について">お取引のご相談</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                    <div class="form-group">
                        <label for="message">お問い合わせ内容</label>
                        <textarea id="message" name="message" placeholder="詳細をご記入下さい" required></textarea>
                    </div>
                    </form>
                    <button type="submit">送信する</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
