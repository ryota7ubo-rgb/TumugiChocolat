<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- リセットCSS -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

    <!-- オリジナルCSS -->
    <link rel="stylesheet" href="./css/style.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>購入方法・取扱店舗</h1>
    <p>紬ショコラは、下記の取扱店舗にて店頭販売しております。お近くの店舗の営業時間をご確認のうえ、お越しください。</p>

    <h2 class="best-market font-english">購入方法</h2>
    <table class="shop">
        <tr>
            <th>販売方法</th>
            <th>取扱店舗での店頭販売</th>
        </tr>
        <tr>
            <th>価格</th>
            <th>1,620円（税込み・9粒入り）</th>
        </tr>
        <tr>
            <th>販売日</th>
            <th>2026年11月14日（土）</th>
        </tr>
    </table>

    <h2 class="handing-shop font-english">取扱店舗</h2>
        <section class="map">
            <div class="map_in">
                <iframe></iframe>
            </div>
            <ul class="shop-list">
                <li>
                    <span class="shop-list_label">店舗名</span>
                    <span class="shop-list_txt">店舗名入力</span>
                </li>
                <li>
                    <span class="shop-list_label">住所</span>
                    <span class="shop-list_txt">住所を入力</span>
                </li>
                <li>
                    <span class="shop-list_label">営業時間</span>
                    <span class="shop-list_txt">営業時間を入力</span>
                </li>
                <li>
                    <span class="shop--list_label">電話番号</span>
                    <span class="shop-list_txt">電話番号を入力</span>
                </li>
            </ul>
        </section>    

</body>
</html>
